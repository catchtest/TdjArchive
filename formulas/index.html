<nav class="nav" aria-label="主要導覽"><div class="nav-inner"><a href="../" class="">典藏總覽</a><a href="../characters/" class="">人物誌</a><a href="../equipment/" class="">裝備錄</a><a href="../skills/" class="">絕學譜</a><a href="../stages/" class="">戰場圖</a><a href="../walkthrough/" class="">流程攻略</a><a href="../guides/" class="">攻略集</a><a href="../recipes/" class="">煉化譜</a><a href="../formulas/" class="active" aria-current="page">公式</a><a href="../statuses/" class="">狀態</a><a href="../gallery/" class="">圖片集</a><a href="../save-editor/" class="">存檔修改</a></div></nav><main id="main" tabindex="-1"><div class="loading"><h1>公式</h1><p>正在載入…</p></div><noscript><p>請啟用網頁指令碼以搜尋資料及操作格子戰場。</p><ul><li>施術基準 = 基本持續量 + ⌊施術者靈智 / 2⌋ + 隨機整數(1~⌊施術者靈智 / 20⌋+1)</li><li>第一段起始量 = trunc(施術基準 * 五魂倍率 * 防具倍率 * 飾品倍率)</li><li>起始持續量 = trunc(第一段起始量 * 目標屬性倍率)</li><li>每次消退量 = 基本消退量 + 2 * trunc(目標靈智 / 隨機整數(5~10))</li><li>異常成立條件:起始持續量 &gt;= 每次消退量</li><li>裝備命中=自己的武器命中+飾品命中</li><li>目標裝備迴避=目標的防具迴避+飾品迴避</li><li>普通命中率 = 裝備命中 - 目標裝備迴避 + trunc((自己運氣 - 目標運氣) / 4)%</li><li>會心率=武器會心+飾品會心</li><li>連擊率=武器連擊+飾品連擊</li><li>附加效果觸發率 = 武器基本機率 + trunc((自己運氣 - 目標運氣) / 10)%</li><li>運氣加值 = ⌊自己的運氣 / 隨機整數(10~20)⌋</li><li>基礎物理傷害=修正後攻擊力-修正後目標防禦力+運氣加值，最低0</li><li>傷害 = ⌊(基礎物理傷害 + ⌊自己的膂力 / 隨機整數(8~20)⌋) * 五魂倍率⌋</li><li>隨機加值上限 = ⌊施法者靈智 / 20⌋ + 1</li><li>施術基準 = 招式基本數值 + ⌊施法者靈智 / 2⌋ + 隨機整數(1~加值上限)</li><li>裝備後傷害 = trunc(施術基準 * 五魂倍率 * 防具承傷倍率 * 飾品承傷倍率)</li><li>最後傷害 = trunc(裝備後傷害 * 目標屬性倍率)</li><li>回復倍率 = 五魂倍率 + ⌊目標筋力 / 20⌋%</li><li>回復量 = ⌊施術基準 * 回復倍率⌋</li><li>減傷機率 = 5% + trunc((目標運氣 - 攻擊者運氣) / 10)%,限制在 0~100%</li><li>五魂倍率=100%+各項五魂修正,最低0%</li><li>凍結機率=招式基本參數-目標「魂」*2,限制在0~100%</li><li>更新後持續量=更新前持續量-每次消退量</li><li>增益起始量 = ⌊(基本持續量 + ⌊施法者靈智 / 2⌋ + 隨機加值) * 五魂倍率⌋</li><li>增益每次消退量 = 基本消退量 - 2 * ⌊受術者靈智 / 隨機整數(5~10)⌋</li><li>異常每次消退量 = 基本消退量 + 2 * ⌊受術者靈智 / 隨機整數(5~10)⌋</li><li>術力吸取基準 = ⌊目標術力上限 / 3⌋</li><li>自爆基準 = ⌊(自己的體力上限 - 目前體力) / 2⌋</li><li>自爆傷害 = trunc(自爆基準 * 目標火屬性倍率)</li><li>每回合基本行動點 = 角色的基本點數 + ⌊迅捷 / 25⌋</li><li>移動後剩餘行動點 ≥ 該絕技的行動消耗，才有足夠點數施放</li><li>體力藥回復量 = ⌊基本回復量 * (100% + ⌊筋力 / 20⌋%)⌋</li><li>術力藥回復量 = ⌊基本回復量 * (100% + ⌊靈智 / 20⌋%)⌋</li><li>等級差 = 目標等級 - 自己等級</li><li>擊倒基準經驗 = max(1, ⌊敵人基礎經驗 * 等級倍率⌋)</li><li>目標不低於自己:倍率=2-(1-等級差/10)^2</li><li>目標低於自己:倍率=(1+等級差/10)^2</li><li>目標不低於自己:其餘目標倍率=2-(1-等級差/10)^3</li><li>目標低於自己:其餘目標倍率=(1+等級差/10)^3</li><li>體力增加 = 3 + trunc((筋力 - 等級) / 35) + 隨機整數(0~2)</li><li>術力增加 = 1 + trunc((靈智 - 等級) / 35) + 隨機整數(0~1)</li></ul></noscript></main>
